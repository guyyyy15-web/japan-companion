name: Refresh map data

# Monthly: re-download toilets, bins, konbini and the quick-search places in Japan from OpenStreetMap,
# commit the new files under app/public/data/ to main, then redeploy the site.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node app/scripts/fetch-facilities.mjs
      # The place scripts only write when a whole run succeeds, so a failed run keeps last month's files.
      - run: node app/scripts/fetch-places.mjs
        continue-on-error: true
      - run: node app/scripts/fetch-places.mjs
        env:
          EXTRA: '1'
        continue-on-error: true
      - id: commit
        run: |
          if git diff --quiet -- app/public/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/public/data/
            git commit -m "Refresh map data from OpenStreetMap"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
